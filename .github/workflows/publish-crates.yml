name: Publish crates.io

on:
  workflow_dispatch:
    inputs:
      version:
        description: Workspace version to publish (without v prefix)
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish workspace crates
    runs-on: ubuntu-24.04
    environment: crates-io
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify requested version
        env:
          FXRS_REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          fxrs_version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test "$FXRS_REQUESTED_VERSION" = "$fxrs_version"
      - name: Verify publishable packages
        run: scripts/publish-crates.sh --check
      - name: Publish packages in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crates.sh --execute
