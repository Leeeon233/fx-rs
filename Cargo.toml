[workspace]
members = [
    "crates/fx-acp-host",
    "crates/fx-auth",
    "crates/fx-cli",
    "crates/fx-config",
    "crates/fx-context",
    "crates/fx-core",
    "crates/fx-mcp",
    "crates/fx-process",
    "crates/fx-provider",
    "crates/fx-store",
    "crates/fx-subagent",
    "crates/fx-terminal-host",
    "crates/fx-tools",
    "crates/fx-tui",
    "crates/fx-workspace",
]
resolver = "3"

[workspace.package]
version = "0.0.6"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/Leeeon233/fx-rs"
description = "A compact, provider-extensible coding agent with a fast terminal interface"
readme = "README.md"

[workspace.dependencies]
agent-client-protocol = "2.0.0"
atomic-write-file = "0.3.1"
base64 = "0.23.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
fs4 = "1.1.0"
futures-util = "0.3.31"
fx-acp-host = { package = "fxrs-acp-host", version = "0.0.6", path = "crates/fx-acp-host" }
fx-auth = { package = "fxrs-auth", version = "0.0.6", path = "crates/fx-auth" }
fx-config = { package = "fxrs-config", version = "0.0.6", path = "crates/fx-config" }
fx-context = { package = "fxrs-context", version = "0.0.6", path = "crates/fx-context" }
fx-core = { package = "fxrs-core", version = "0.0.6", path = "crates/fx-core" }
fx-mcp = { package = "fxrs-mcp", version = "0.0.6", path = "crates/fx-mcp" }
fx-process = { package = "fxrs-process", version = "0.0.6", path = "crates/fx-process" }
fx-provider = { package = "fxrs-provider", version = "0.0.6", path = "crates/fx-provider" }
fx-store = { package = "fxrs-store", version = "0.0.6", path = "crates/fx-store" }
fx-subagent = { package = "fxrs-subagent", version = "0.0.6", path = "crates/fx-subagent" }
fx-terminal-host = { package = "fxrs-terminal-host", version = "0.0.6", path = "crates/fx-terminal-host" }
fx-tools = { package = "fxrs-tools", version = "0.0.6", path = "crates/fx-tools" }
fx-tui = { package = "fxrs-tui", version = "0.0.6", path = "crates/fx-tui" }
fx-workspace = { package = "fxrs-workspace", version = "0.0.6", path = "crates/fx-workspace" }
hex = "0.4.3"
html2text = { version = "0.17.1", default-features = false }
http = "1.5.0"
jiff = { version = "0.2.15", default-features = false, features = ["std"] }
libc = "0.2.177"
nix = { version = "0.28.0", default-features = false, features = ["signal"] }
pollster = "1.0.1"
portable-pty = "0.9.0"
process-wrap = { version = "9.1.0", default-features = false, features = [
    "job-object",
    "kill-on-drop",
    "process-group",
    "tokio1",
] }
ratatui = { version = "0.30.2", default-features = false, features = [
    "crossterm_0_29",
] }
ratatui-textarea = { version = "0.9.2", default-features = false, features = [
    "crossterm",
] }
rmcp = { version = "3.1.3", default-features = false, features = [
    "client",
    "reqwest-tls-no-provider",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
reqwest = { version = "0.13.4", default-features = false, features = [
    "deflate",
    "gzip",
    "rustls-no-provider",
    "zstd",
] }
rustls = { version = "0.23.43", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["preserve_order"] }
sha2 = "0.10.9"
stream-rs = "0.1.0"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "sync",
    "time",
] }
tui-markdown = { version = "0.3.9", default-features = false }
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
url = "2.5.7"
uuid = { version = "1.24.1", features = ["v4"] }
unicode-width = "0.2.2"
vt100 = "0.16.2"
zeroize = { version = "1.8.2", features = ["derive", "serde"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
